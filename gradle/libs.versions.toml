serialization = "1.9.0"
coroutines = "1.10.2"
flyway = "11.14.1"
postgres = "42.7.14"
hikari = "6.3.3"
poi = "5.4.1"
logback = "1.5.21"
junit = "5.13.4"
composeBom = "2025.11.01"
okhttp = "4.12.0"

composeBomV = "2025.11.01"
navigation = "2.9.6"
lifecycle = "2.9.4"
activityCompose = "1.11.0"
coreKtx = "1.17.0"
appcompat = "1.7.1"

[libraries]
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBomV" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
